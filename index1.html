<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空运计费重计算器（尺寸+数量）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 560px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { font-size: 22px; text-align: center; }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label { display: block; margin-top: 16px; font-weight: bold; }
        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
        }
        textarea { height: 110px; resize: vertical; }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #1557b0; }
        .result {
            margin-top: 24px;
            padding: 16px;
            background: #e8f0fe;
            border-radius: 8px;
            display: none;
        }
        .result.show { display: block; }
        .result p { margin: 8px 0; font-size: 16px; }
        .highlight { font-size: 24px; font-weight: bold; color: #1a73e8; }
        .box-item {
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            font-size: 14px;
        }
        .error { color: #d93025; font-size: 14px; margin-top: 8px; }
        .tip { color: #666; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✈️ 空运计费重计算器</h1>
        <p class="tip">
            每件写 <b>长 × 宽 × 高 × 数量</b>，多件用 <b>+</b>、<b>,</b>、<b>，</b>、分号、空格或换行分隔。<br>
            支持 <b>100*80*60*2</b>、<b>100x80x60x2</b>、<b>100 80 60 2</b>、带 cm/m 单位。
        </p>

        <label>尺寸 + 数量</label>
        <textarea id="dimsInput" placeholder="例如：
100*80*60*2 + 90*70*50*1
1.2×0.8×0.6m×3
100cm 80cm 60cm 5"></textarea>

        <label>默认单位（文本里没写单位时使用）</label>
        <select id="unitSelect">
            <option value="cm">厘米（cm）</option>
            <option value="m">米（m）</option>
            <option value="mm">毫米（mm）</option>
            <option value="in">英寸（in）</option>
        </select>

        <label>实际总重量（kg，选填）</label>
        <input type="number" id="actualWeight" placeholder="例如：50" step="0.1" min="0">

        <label>体积重除数</label>
        <select id="divisorSelect">
            <option value="6000">6000（空运标准）</option>
            <option value="5000">5000（部分快递）</option>
        </select>

        <button onclick="calculate()">计算</button>

        <div id="errorBox" class="error"></div>

        <div id="resultBox" class="result">
            <div id="boxList"></div>
            <p>总体积重量：<span id="volWeight">-</span> kg</p>
            <p>实际总重量：<span id="actWeight">-</span> kg</p>
            <p>计费重量（取大者）：<span id="chargeWeight" class="highlight">-</span> kg</p>
            <p class="tip" id="hint"></p>
        </div>
    </div>

    <script>
        const TO_CM = { cm: 1, m: 100, mm: 0.1, in: 2.54 };

        function calculate() {
            const text = document.getElementById('dimsInput').value.trim();
            const defaultUnit = document.getElementById('unitSelect').value;
            const divisor = parseFloat(document.getElementById('divisorSelect').value);
            const actualInput = document.getElementById('actualWeight').value;
            const actual = actualInput === '' ? null : parseFloat(actualInput);

            const errorBox = document.getElementById('errorBox');
            const resultBox = document.getElementById('resultBox');
            errorBox.innerHTML = '';
            resultBox.classList.remove('show');

            if (!text) {
                errorBox.textContent = '请先粘贴尺寸。';
                return;
            }

            // 1. 先按明确分隔符切段：+ , ， ; ； 换行
            //    注意保护欧洲小数逗号 "1,2"
            let segments = text
                .replace(/[，;；]/g, ',')
                .replace(/\+/g, ',')
                .split(/\n|,(?!\d)/)
                .map(s => s.trim())
                .filter(s => s.length > 0);

            // 2. 如果某段里用空格写了多件（如 "100 80 60 2 90 70 50 1"），
            //    段内数字个数是 4 的倍数就按 4 个一组处理。
            //    注意：空格也可能是 "100 80 60 2" 这种一件的写法，所以不强行按空格拆段，
            //    而是统一"提取数字 + 每4个一组"。

            const boxes = [];
            const errors = [];

            segments.forEach((seg, idx) => {
                // 提取数字 + 可选单位
                const regex = /(\d+(?:[.,]\d+)?)\s*(cm|m|mm|in|厘米|米|毫米|英寸)?/gi;
                const tokens = [];
                let m;
                while ((m = regex.exec(seg)) !== null) {
                    let num = parseFloat(m[1].replace(',', '.'));
                    let unit = (m[2] || '').toLowerCase();
                    if (unit === '厘米') unit = 'cm';
                    if (unit === '米') unit = 'm';
                    if (unit === '毫米') unit = 'mm';
                    if (unit === '英寸') unit = 'in';
                    if (isNaN(num) || num <= 0) continue;
                    tokens.push({ num, unit: unit || null });
                }

                if (tokens.length === 0) {
                    errors.push(`第 ${idx + 1} 段没有识别到有效数字：${seg}`);
                    return;
                }
                if (tokens.length % 4 !== 0) {
                    errors.push(`第 ${idx + 1} 段数字个数是 ${tokens.length}，不是 4 的倍数（长、宽、高、数量）：${seg}`);
                    return;
                }

                // 每 4 个数字组成一件
                for (let i = 0; i < tokens.length; i += 4) {
                    const t = [tokens[i], tokens[i+1], tokens[i+2], tokens[i+3]];
                    const qty = t[3].num;
                    // 数量必须是正整数
                    if (!Number.isInteger(qty) || qty <= 0) {
                        errors.push(`第 ${idx + 1} 段的数量 "${t[3].num}" 不是正整数：${seg}`);
                        continue;
                    }

                    // 前三个换算成厘米
                    const dimsCm = t.slice(0, 3).map(item => {
                        const u = item.unit || defaultUnit;
                        const factor = TO_CM[u] !== undefined ? TO_CM[u] : 1;
                        return item.num * factor;
                    });

                    const volumeCm3 = dimsCm[0] * dimsCm[1] * dimsCm[2];
                    boxes.push({
                        dimsCm,
                        qty,
                        volumeCm3,
                        volWeight: (volumeCm3 / divisor) * qty
                    });
                }
            });

            if (errors.length > 0) {
                errorBox.innerHTML = errors.join('<br>');
            }
            if (boxes.length === 0) {
                if (errors.length === 0) errorBox.textContent = '没有识别到有效的尺寸。';
                return;
            }

            // 3. 汇总
            const totalVolWeight = boxes.reduce((sum, b) => sum + b.volWeight, 0);

            const boxList = document.getElementById('boxList');
            boxList.innerHTML = boxes.map((b, i) => {
                const dims = b.dimsCm.map(d => d.toFixed(1)).join(' × ');
                return `<div class="box-item">第 ${i+1} 件：${dims} cm　×　数量 ${b.qty}　→　体积重 ${b.volWeight.toFixed(2)} kg</div>`;
            }).join('');

            document.getElementById('volWeight').textContent = totalVolWeight.toFixed(2);
            document.getElementById('actWeight').textContent = actual === null ? '未填写' : actual.toFixed(2);

            let chargeWeight, hint;
            if (actual === null) {
                chargeWeight = totalVolWeight;
                hint = '未填写实际重量，仅显示体积重量。';
            } else {
                chargeWeight = Math.max(actual, totalVolWeight);
                if (totalVolWeight > actual) hint = '💡 泡货：体积重大于实重，按体积重计费。';
                else if (actual > totalVolWeight) hint = '💡 重货：实重大于体积重，按实际重量计费。';
                else hint = '💡 实重和体积重持平。';
            }
            document.getElementById('chargeWeight').textContent = chargeWeight.toFixed(2);
            document.getElementById('hint').textContent = hint;
            resultBox.classList.add('show');
        }
    </script>
</body>
</html>
